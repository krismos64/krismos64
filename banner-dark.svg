<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 410" width="1280" height="410" role="img" aria-labelledby="t d">
  <title id="t">Christophe Mostefaoui, développeur fullstack Next.js et TypeScript</title>
  <desc id="d">Un git push déclenche un pipeline commit, lint, tests, build, deploy, prod dont chaque étape passe au vert. Du besoin métier à la mise en production. Région Pau, Tarbes, Orthez.</desc>
  <style>
    .bg{fill:#0d1117;stroke:#30363d;stroke-width:2}
    .sans{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}
    .mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
    .name{fill:#e6edf3;font-size:56px;font-weight:700;letter-spacing:-.5px}
    .role{fill:#8b949e;font-size:24px}
    .pitch{fill:#e6edf3;font-size:19px}
    .pitch tspan{fill:#3fb950;font-weight:600}
    .prompt{fill:#58a6ff}
    .cmd{fill:#e6edf3}
    .cover{fill:#0d1117}
    .cursor{fill:#58a6ff}
    .track{stroke:#30363d;stroke-width:4;stroke-linecap:round}
    .prog{stroke:#3fb950;stroke-width:4;stroke-linecap:round;stroke-dasharray:1040;stroke-dashoffset:0}
    .dot{fill:#3fb950;stroke:#3fb950;stroke-width:3}
    .chk{fill:none;stroke:#0d1117;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
    .lbl{fill:#e6edf3;font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;font-size:16px;font-weight:600}
    .cap{fill:#8b949e;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:14px}
    .packet{fill:#3fb950;opacity:0}
    .ring{fill:none;stroke:#3fb950;stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:center}
    .pill{fill:#3fb95022;stroke:#3fb950;stroke-width:1.2}
    .pilltxt{fill:#3fb950;font-size:15px;font-weight:600}
    .live{fill:#3fb950;transform-box:fill-box;transform-origin:center}
    .rise{animation:rise .7s ease-out backwards}
    .r1{animation-delay:.15s} .r2{animation-delay:.3s} .r3{animation-delay:.45s} .r4{animation-delay:.6s}
    .typer{animation:type .9s steps(34) .25s backwards}
    .cursor{animation:blink 1.1s steps(1) 1.2s infinite}
    .prog{animation:draw 2.6s cubic-bezier(.45,.05,.55,.95) 1.1s backwards}
    .packet{animation:travel 2.6s cubic-bezier(.45,.05,.55,.95) 1.1s backwards}
    .ring{animation:ring 2.4s ease-out 4.0s infinite}
    .live{animation:breathe 2.4s ease-in-out infinite}
    .s0 .dot{animation:pass .35s ease-out 1.10s backwards}.s0 .chk{animation:pop .35s ease-out 1.20s backwards}.s0 .lbl{animation:lit .35s ease-out 1.10s backwards}.s1 .dot{animation:pass .35s ease-out 1.62s backwards}.s1 .chk{animation:pop .35s ease-out 1.72s backwards}.s1 .lbl{animation:lit .35s ease-out 1.62s backwards}.s2 .dot{animation:pass .35s ease-out 2.14s backwards}.s2 .chk{animation:pop .35s ease-out 2.24s backwards}.s2 .lbl{animation:lit .35s ease-out 2.14s backwards}.s3 .dot{animation:pass .35s ease-out 2.66s backwards}.s3 .chk{animation:pop .35s ease-out 2.76s backwards}.s3 .lbl{animation:lit .35s ease-out 2.66s backwards}.s4 .dot{animation:pass .35s ease-out 3.18s backwards}.s4 .chk{animation:pop .35s ease-out 3.28s backwards}.s4 .lbl{animation:lit .35s ease-out 3.18s backwards}.s5 .dot{animation:pass .35s ease-out 3.70s backwards}.s5 .chk{animation:pop .35s ease-out 3.80s backwards}.s5 .lbl{animation:lit .35s ease-out 3.70s backwards}
    @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
    @keyframes type{from{transform:translateX(-420px)}to{transform:none}}
    @keyframes blink{0%{opacity:1}50%{opacity:0}}
    @keyframes draw{from{stroke-dashoffset:1040}to{stroke-dashoffset:0}}
    @keyframes travel{0%{transform:none;opacity:1}92%{opacity:1}100%{transform:translateX(1040px);opacity:0}}
    @keyframes pass{from{fill:#161b22;stroke:#30363d}to{fill:#3fb950;stroke:#3fb950}}
    @keyframes pop{from{opacity:0}to{opacity:1}}
    @keyframes lit{from{fill:#8b949e}to{fill:#e6edf3}}
    @keyframes ring{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(2.1)}}
    @keyframes breathe{0%,100%{opacity:1}50%{opacity:.35}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>

  <rect class="bg" x="1" y="1" width="1278" height="408" rx="20"/>

  <!-- Ligne de commande tapée -->
  <text class="mono" x="72" y="80" font-size="20" textLength="396" lengthAdjust="spacingAndGlyphs"><tspan class="prompt">~/krismos64 $ </tspan><tspan class="cmd">git push origin main</tspan></text>
  <g class="typer">
    <rect class="cover" x="480" y="56" width="436" height="34"/>
    <rect class="cursor" x="472" y="61" width="10" height="24" rx="1"/>
  </g>

  <!-- Statut -->
  <rect class="pill" x="1004" y="50" width="204" height="38" rx="19"/>
  <circle class="live" cx="1026" cy="69" r="5.5"/>
  <text class="sans pilltxt" x="1040" y="74">Pau · Tarbes · Orthez</text>

  <!-- Identité -->
  <text class="sans name rise r1" x="70" y="160">Christophe Mostefaoui</text>
  <text class="sans role rise r2" x="72" y="200">Développeur Fullstack · Next.js · TypeScript · Node.js</text>
  <text class="sans pitch rise r3" x="72" y="236">Du besoin métier <tspan>à la mise en production</tspan></text>

  <!-- Pipeline -->
  <line class="track" x1="120" y1="312" x2="1160" y2="312"/>
  <line class="prog" x1="120" y1="312" x2="1160" y2="312"/>
  <circle class="packet" cx="120" cy="312" r="7"/>
  <circle class="ring" cx="1160" cy="312" r="15"/>
    <g class="s0">
      <circle class="dot" cx="120" cy="312" r="15"/>
      <path class="chk" d="M114 312 l4.5 4.5 l8 -9" />
      <text class="lbl" x="120" y="356" text-anchor="middle">commit</text>
      <text class="cap" x="120" y="378" text-anchor="middle">main</text>
    </g>
    <g class="s1">
      <circle class="dot" cx="328" cy="312" r="15"/>
      <path class="chk" d="M322 312 l4.5 4.5 l8 -9" />
      <text class="lbl" x="328" y="356" text-anchor="middle">lint</text>
      <text class="cap" x="328" y="378" text-anchor="middle">ESLint · tsc</text>
    </g>
    <g class="s2">
      <circle class="dot" cx="536" cy="312" r="15"/>
      <path class="chk" d="M530 312 l4.5 4.5 l8 -9" />
      <text class="lbl" x="536" y="356" text-anchor="middle">tests</text>
      <text class="cap" x="536" y="378" text-anchor="middle">Vitest · Playwright</text>
    </g>
    <g class="s3">
      <circle class="dot" cx="744" cy="312" r="15"/>
      <path class="chk" d="M738 312 l4.5 4.5 l8 -9" />
      <text class="lbl" x="744" y="356" text-anchor="middle">build</text>
      <text class="cap" x="744" y="378" text-anchor="middle">Docker</text>
    </g>
    <g class="s4">
      <circle class="dot" cx="952" cy="312" r="15"/>
      <path class="chk" d="M946 312 l4.5 4.5 l8 -9" />
      <text class="lbl" x="952" y="356" text-anchor="middle">deploy</text>
      <text class="cap" x="952" y="378" text-anchor="middle">VPS OVH</text>
    </g>
    <g class="s5">
      <circle class="dot" cx="1160" cy="312" r="15"/>
      <path class="chk" d="M1154 312 l4.5 4.5 l8 -9" />
      <text class="lbl" x="1160" y="356" text-anchor="middle">prod</text>
      <text class="cap" x="1160" y="378" text-anchor="middle">200 OK</text>
    </g>
</svg>
